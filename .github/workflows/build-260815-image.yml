name: Build 260815 article image v2

on:
  push:
    branches: [ main ]
    paths:
      - '.build_260815_v2.trigger'

permissions:
  contents: write

jobs:
  build-image-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify versioned JPEG
        shell: bash
        run: |
          set -euo pipefail
          trigger='.build_260815_v2.trigger'
          target='260815.AutoGen.반도체 FAB AI, 분석을 넘어 공정 제어로 들어간다.v2.jpg'
          if [ ! -f "$trigger" ]; then
            echo 'No v2 trigger; exit.'
            exit 0
          fi
          if [ -e "$target" ]; then
            echo "Refusing to overwrite existing versioned image: $target"
            exit 1
          fi
          python -m pip install --quiet pillow
          cat .tmp_260815_v2.part*.b64 | base64 --decode > "$target"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('260815.AutoGen.반도체 FAB AI, 분석을 넘어 공정 제어로 들어간다.v2.jpg')
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG', im.format
              assert im.size == (1200, 675), im.size
          b = p.read_bytes()
          assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9'
          assert len(b) == 47630, len(b)
          print('Verified versioned JPEG', len(b), 'bytes')
          PY
      - name: Remove temporary transfer files
        shell: bash
        run: |
          rm -f .tmp_260815_v2.part*.b64 .build_260815_v2.trigger
          rm -f .tmp_260815_image.part*.b64 .build_260815_image.trigger
          rm -f .image_part_*.b64 .save_260814_image.trigger .fetch_canva_260815.trigger .tmp_test_path.txt
      - name: Commit versioned image and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'k-article-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Save verified 260815 representative image v2 and cleanup transfer files'
          git push origin main
