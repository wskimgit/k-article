name: build-260911-v3-image

on:
  push:
    branches: [main]
    paths:
      - '.build_260911_v3.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Reconstruct and validate JPEG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io

          parts = sorted(Path('_upload_260911_v3').glob('part*.b64'))
          assert len(parts) == 8, f'expected 8 parts, got {len(parts)}'
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          data = base64.b64decode(encoded, validate=True)
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', 'invalid JPEG markers'
          im = Image.open(io.BytesIO(data))
          im.load()
          assert im.format == 'JPEG', im.format
          assert im.size == (1200, 675), im.size
          out = Path('260911.AutoGen.반도체 FAB 배기가스 처리, 장비를 더 놓기보다 덕트 안으로 들어간다.v3.jpg')
          out.write_bytes(data)
          print(out, len(data), im.size)
          PY
      - name: Commit final image and clean temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '260911.AutoGen.반도체 FAB 배기가스 처리, 장비를 더 놓기보다 덕트 안으로 들어간다.v3.jpg'
          git rm -f .build_260911_v3.trigger .github/workflows/build-260911-v3.yml _upload_260911_v3/part*.b64
          git commit -m 'replace 260911 representative image with v3'
          git push origin main
