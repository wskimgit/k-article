name: Build 260815 article image

on:
  push:
    branches: [ main ]
    paths:
      - '.build_260815_image.trigger'

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .build_260815_image.trigger ]; then
            echo 'No trigger; exit.'
            exit 0
          fi
          python -m pip install --quiet pillow
          cat .tmp_260815_image.part*.b64 | base64 --decode > '260815.AutoGen.반도체 FAB AI, 분석을 넘어 공정 제어로 들어간다.jpg'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('260815.AutoGen.반도체 FAB AI, 분석을 넘어 공정 제어로 들어간다.jpg')
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG', im.format
              assert im.size == (1200, 675), im.size
          b = p.read_bytes()
          assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9'
          assert len(b) > 100000
          print('Verified JPEG', len(b), 'bytes')
          PY
      - name: Remove temporary transfer files
        shell: bash
        run: |
          rm -f .tmp_260815_image.part*.b64 .build_260815_image.trigger
          rm -f .image_part_*.b64 .save_260814_image.trigger
      - name: Commit final image and cleanup
        shell: bash
        run: |
          git config user.name 'k-article-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Save verified 260815 article image and remove temp base64 files'
          git push origin main
