name: Save verified 260911 article image

on:
  push:
    branches: [ main ]
    paths:
      - '.save_260911.trigger'

permissions:
  contents: write

jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          TARGET='260911.AutoGen.반도체 FAB 배기가스 처리, 장비를 더 놓기보다 덕트 안으로 들어간다.v1.jpg'
          cat .tmp260911_*.b64 > /tmp/260911.b64
          base64 -d /tmp/260911.b64 > "$TARGET"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('260911.AutoGen.반도체 FAB 배기가스 처리, 장비를 더 놓기보다 덕트 안으로 들어간다.v1.jpg')
          b=p.read_bytes()
          assert b[:2] == b'\xff\xd8'
          assert b[-2:] == b'\xff\xd9'
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG'
              assert im.size == (1200,675)
          assert len(b) > 50000
          print('verified', p.name, len(b), hashlib.sha256(b).hexdigest())
          PY
      - name: Commit final image and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          TARGET='260911.AutoGen.반도체 FAB 배기가스 처리, 장비를 더 놓기보다 덕트 안으로 들어간다.v1.jpg'
          rm -f .tmp260911_*.b64 .save_260911.trigger
          git rm -f .github/workflows/save-260911-image.yml
          git config user.name 'k-article-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$TARGET"
          git add -A
          git commit -m 'Save verified 260911 representative image v1'
          git push origin main
